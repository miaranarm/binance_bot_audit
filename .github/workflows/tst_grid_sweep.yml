name: TST Grid Sweep

on:
  workflow_dispatch:
  push:
    paths:
      - "src/tst_grid_sweep.py"
      - ".github/workflows/tst_grid_sweep.yml"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests tabulate

      - name: Run TST grid sweep
        run: python src/tst_grid_sweep.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tst_grid_sweep.csv results/tst_grid_sweep_summary.md
          git diff --cached --quiet || git commit -m "research: TST grid sweep results"
          git pull --rebase origin main
          git push
