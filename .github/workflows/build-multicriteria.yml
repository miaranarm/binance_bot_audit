name: Build multicriteria enriched

# Se déclenche à la fin du workflow "Binance Public Bot Audit" (celui qui génère
# results/current_multicriteria.csv via src/audit_all.py), donc sur des données fraîches.
# Génère results/current_multicriteria_enriched.csv.

on:
  workflow_run:
    workflows: ["Binance Public Bot Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-multicriteria
  cancel-in-progress: false

env:
  INPUT_CSV: results/current_multicriteria.csv
  OUTPUT_CSV: results/current_multicriteria_enriched.csv

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (dernière version de main, y compris le commit de l'audit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/build_multicriteria.py

      - name: Dépendances
        run: pip install pandas numpy openpyxl

      - name: Vérifier le fichier source
        run: |
          if [ ! -s "$INPUT_CSV" ]; then
            echo "::error::$INPUT_CSV introuvable ou vide"
            exit 1
          fi
          ls -l "$INPUT_CSV"

      - name: Générer le fichier enrichi
        run: python src/build_multicriteria.py "$INPUT_CSV" "$OUTPUT_CSV"

      - name: Contrôle de sortie (comptage des lignes)
        run: |
          in_rows=$(( $(python -c "import pandas as pd;print(len(pd.read_csv('$INPUT_CSV')))") ))
          out_rows=$(( $(python -c "import pandas as pd;print(len(pd.read_csv('$OUTPUT_CSV')))") ))
          echo "lignes source=$in_rows, lignes enrichies=$out_rows"
          if [ "$out_rows" -lt 1 ] || [ "$out_rows" -gt "$in_rows" ]; then
            echo "::error::Nombre de lignes incohérent"; exit 1
          fi

      - name: Commit et push (uniquement si le fichier a changé)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_CSV"
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "enrich: multicriteria score [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Échec du push après 3 tentatives"
          exit 1
