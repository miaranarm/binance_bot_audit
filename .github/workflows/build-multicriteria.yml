name: Build multicriteria enriched

# À placer dans : .github/workflows/build-multicriteria.yml
# Génère results/current_multicriteria_enriched.csv à partir de results/current_multicriteria.csv
# (ce dernier est produit par un autre workflow, qui n'est jamais modifié ici).
# Le script est supposé être dans src/build_multicriteria.py.

on:
  schedule:
    # Toutes les heures à HH:15 UTC, pour laisser le temps à l'actualisation
    # Binance + au workflow qui génère current_multicriteria.csv.
    # Ajuste la minute si ton autre workflow finit plus tard.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Un seul run à la fois ; un run en attente remplace le précédent.
concurrency:
  group: build-multicriteria
  cancel-in-progress: false

env:
  INPUT_CSV: results/current_multicriteria.csv
  OUTPUT_CSV: results/current_multicriteria_enriched.csv

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (dernière version du dépôt)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install pandas numpy openpyxl

      - name: Vérifier le fichier source
        run: |
          if [ ! -s "$INPUT_CSV" ]; then
            echo "::error::$INPUT_CSV introuvable ou vide (le workflow qui le génère a-t-il tourné ?)"
            exit 1
          fi
          ls -l "$INPUT_CSV"

      - name: Générer le fichier enrichi
        run: python src/build_multicriteria.py "$INPUT_CSV" "$OUTPUT_CSV"

      - name: Contrôle de sortie
        run: |
          test "$(wc -l < "$OUTPUT_CSV")" -gt 1
          head -c 600 "$OUTPUT_CSV"

      - name: Commit et push (uniquement si le fichier a changé)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_CSV"
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "chore: update $OUTPUT_CSV ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # L'autre workflow pousse aussi sur la branche : on rebase puis on réessaie.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Échec du push après 3 tentatives"
          exit 1
