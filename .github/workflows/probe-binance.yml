name: Probe Binance strategy

on:
  workflow_dispatch:
    inputs:
      strategy_id:
        description: "Numero du bot (strategyId)"
        required: true
        default: "10142665"
      endpoint:
        description: "Nom de la requete (ex: queryRoiChart)"
        required: true
        default: "queryRoiChart"
      base:
        description: "Domaine Binance"
        required: true
        default: "https://www.binance.com"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run probe
        run: |
          python tools/binance_strategy_probe.py "${{ github.event.inputs.strategy_id }}" \
            --endpoint "${{ github.event.inputs.endpoint }}" \
            --base "${{ github.event.inputs.base }}"
