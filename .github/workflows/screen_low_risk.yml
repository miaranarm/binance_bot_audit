name: Low Risk High Return Screen
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python src/screen_low_risk.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/low_risk_high_return.csv
          git diff --cached --quiet || git commit -m "audit: screen low risk high return bots"
          git push
