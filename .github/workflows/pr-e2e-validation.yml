name: PR end-to-end Binance validation

# Run on PR changes so the full scan is validated before merge.
# This workflow deliberately does not commit or push results to main.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/pr-e2e-validation.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pandas numpy

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run public Binance Marketplace scan
        run: python src/audit_all.py

      - name: Validate raw Grid Profit calculations and provenance
        run: python src/validate_results.py

      - name: Build final CSV (29 columns, score, rank)
        run: python src/build_multicriteria.py results/current_multicriteria.csv results/current_multicriteria.csv

      - name: Validate final CSV
        run: python src/validate_final_csv.py results/current_multicriteria.csv

      - name: Upload end-to-end outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-e2e-validation-${{ github.run_id }}
          path: |
            results/current_multicriteria.csv
            results/current_multicriteria_summary.txt
            results/scan_meta.json
            results/type_census.json
            results/grid_profit_validation.json
            results/capital_field_diagnostics.json
            strategy_detail_debug.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
