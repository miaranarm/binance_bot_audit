name: Historical extrema candle diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/audit_extrema_candles.py'
      - '.github/workflows/extrema-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: extrema-candle-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose exact candles behind extreme prices
        run: python src/audit_extrema_candles.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: extrema-candle-diagnostic
          path: diagnostics/extrema_candle_diagnostic.csv
          retention-days: 30
      - name: Commit report
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/extrema_candle_diagnostic.csv
          if git diff --cached --quiet; then
            echo "No diagnostic report changes."
            exit 0
          fi
          git commit -m "extrema diagnostic report [skip ci]"
          git push origin HEAD:main
