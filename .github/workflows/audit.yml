name: Binance Public Bot Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: binance-public-bot-audit
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'push' ||
      (
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, 'audit: hourly snapshot') &&
        !contains(github.event.head_commit.message, 'maintenance: compact') &&
        !contains(github.event.head_commit.message, 'cleanup:')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Capture full Binance Marketplace network
        continue-on-error: true
        run: python tools/probe_marketplace_network.py

      - name: Upload Marketplace network capture
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-network-${{ github.run_id }}
          path: results/marketplace_network_raw.json
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: Capture strategy detail after Marketplace card click
        continue-on-error: true
        run: python tools/probe_marketplace_click.py

      - name: Upload Marketplace click capture
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-click-${{ github.run_id }}
          path: results/marketplace_click_raw.json
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: Search Marketplace JavaScript for metric endpoints
        continue-on-error: true
        run: python tools/probe_marketplace_js.py

      - name: Upload Marketplace JS endpoint search
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-js-${{ github.run_id }}
          path: results/marketplace_js_endpoints.json
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: Capture native Binance strategy detail
        continue-on-error: true
        run: python tools/probe_strategy_detail.py

      - name: Upload native strategy detail
        uses: actions/upload-artifact@v4
        with:
          name: strategy-detail-native-${{ github.run_id }}
          path: results/strategy_detail_raw.json
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: Run hourly Binance scan
        run: python src/audit_all.py

      - name: Validate Grid Profit calculations
        run: python src/validate_results.py

      - name: Verify strategy detail diagnostics
        run: |
          echo "PWD=$(pwd)"
          find . -maxdepth 3 -name "strategy_detail_debug.log" -print
          find . -maxdepth 3 -name "strategy_detail_debug.log" -exec wc -c {} +
          ls -la

      - name: Upload strategy detail diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: strategy-detail-debug-${{ github.run_id }}
          path: strategy_detail_debug.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Keep only the lean result set
        run: |
          find results -maxdepth 1 -type f             ! -name 'current_multicriteria.csv'             ! -name 'current_multicriteria_summary.txt'             ! -name 'scan_meta.json'             ! -name 'type_census.json'             ! -name 'grid_profit_validation.json'             ! -name 'strategy_detail_raw.json'             ! -name 'marketplace_network_raw.json'             ! -name 'marketplace_click_raw.json'             ! -name 'marketplace_js_endpoints.json'             -delete

      - name: Upload 90-day archival snapshot
        uses: actions/upload-artifact@v4
        with:
          name: binance-bots-${{ github.run_id }}
          path: results/history/
          retention-days: 90
          compression-level: 9

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          git commit -m "audit: hourly snapshot [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Results pushed successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; refreshing origin/main."
            git fetch origin main
          done

          echo "Unable to push audit results after 3 attempts."
          exit 1

      - name: Compact Git history monthly
        if: ${{ github.event_name == 'schedule' && startsWith(github.event.schedule, '15 0 1 * *') }}
        run: |
          git fetch origin main
          git checkout --orphan compact-main
          git add -A
          git commit -m "maintenance: compact retained bot history [skip ci]"
          git push --force origin HEAD:main
