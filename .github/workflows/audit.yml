name: Binance Public Bot Audit

# Pipeline unique, toutes les heures :
#   audit_all.py            -> collecte brute (results/current_multicriteria.csv + historique avec provenance)
#   validate_results.py     -> contrôle du brut
#   build_multicriteria.py  -> réécrit current_multicriteria.csv avec les 29 colonnes, le score et le rang
#   validate_final_csv.py   -> contrôle du fichier final

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

# Un push sur main relance l'audit avec le code à jour ; la concurrence annule les runs périmés.
concurrency:
  group: binance-public-bot-audit
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'push' ||
      (
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, 'audit: hourly snapshot') &&
        !contains(github.event.head_commit.message, 'cleanup:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pandas numpy
      - run: playwright install --with-deps chromium

      - name: Run hourly Binance scan
        run: python src/audit_all.py

      - name: Collection completeness report
        run: |
          python - <<'PY'
          import json
          meta = json.load(open("results/scan_meta.json", encoding="utf-8"))
          print(f"raw_rows={meta['raw_rows']} retenues={meta['tradable_leverage_le_1']} complete={meta['collection_complete']}")
          for name, s in meta.get("collection", {}).items():
              if not s.get("complete"):
                  print(f"::warning::{name}: collecte={s.get('collected')} uniques={s.get('unique_collected')} attendu={s.get('expected')}")
          PY

      - name: Validate raw Grid Profit calculations
        run: python src/validate_results.py

      - name: Build final current_multicriteria.csv (29 columns, score, rank)
        run: python src/build_multicriteria.py results/current_multicriteria.csv results/current_multicriteria.csv

      - name: Validate final CSV
        run: python src/validate_final_csv.py results/current_multicriteria.csv

      - name: Upload strategy detail diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: strategy-detail-debug-${{ github.run_id }}
          path: strategy_detail_debug.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Keep only durable results
        run: |
          set -e
          # Garde le rapport courant, les diagnostics de scan et l'historique horaire (results/history/).
          find results -maxdepth 1 -type f \
            -not -name 'current_multicriteria.csv' \
            -not -name 'current_multicriteria_summary.txt' \
            -not -name 'scan_meta.json' \
            -not -name 'type_census.json' \
            -not -name 'grid_profit_validation.json' \
            -delete
          rm -f strategy_detail_debug.log

      - name: Upload 90-day archival snapshot
        uses: actions/upload-artifact@v4
        with:
          name: binance-bots-${{ github.run_id }}
          path: results/history/
          retention-days: 90
          compression-level: 9

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          git commit -m "audit: hourly snapshot [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Results pushed successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; refreshing origin/main."
            git fetch origin main
          done

          echo "Unable to push audit results after 3 attempts."
          exit 1
