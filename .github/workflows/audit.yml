name: Binance Public Bot Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: binance-public-bot-audit
  cancel-in-progress: true

jobs:
  audit:
    # Result commits and monthly compaction also land on main. Do not launch
    # a second scan from those maintenance commits.
    if: >-
      github.event_name != 'push' ||
      (
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, 'audit: hourly snapshot') &&
        !contains(github.event.head_commit.message, 'maintenance: compact')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Run hourly Binance scan
        run: python src/audit_all.py

      - name: Keep only the lean result set
        run: |
          find results -maxdepth 1 -type f \
            ! -name 'current_multicriteria.csv' \
            ! -name 'current_multicriteria_summary.txt' \
            ! -name 'scan_meta.json' \
            ! -name 'type_census.json' \
            -delete

      - name: Upload 90-day archival snapshot
        uses: actions/upload-artifact@v4
        with:
          name: binance-bots-${{ github.run_id }}
          path: results/history/
          retention-days: 90
          compression-level: 9

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "audit: hourly snapshot [skip ci]"
          git push

      - name: Compact Git history monthly
        if: ${{ github.event_name == 'schedule' && startsWith(github.event.schedule, '15 0 1 * *') }}
        run: |
          git checkout --orphan compact-main
          git add -A
          git commit -m "maintenance: compact retained bot history [skip ci]"
          git push --force origin HEAD:main
