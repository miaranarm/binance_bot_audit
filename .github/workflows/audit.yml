name: Binance Public Bot Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: binance-public-bot-audit
  cancel-in-progress: true

jobs:
  audit:
    # Result commits and monthly compaction also land on main. Do not launch
    # a second scan from those maintenance commits.
    if: >-
      github.event_name != 'push' ||
      (
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, 'audit: hourly snapshot') &&
        !contains(github.event.head_commit.message, 'maintenance: compact') &&
        !contains(github.event.head_commit.message, 'cleanup:')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Run hourly Binance scan
        run: python src/audit_all.py

      - name: Verify strategy detail diagnostics
        run: |
          echo "PWD=$(pwd)"
          find . -maxdepth 3 -name "strategy_detail_debug.log" -print
          find . -maxdepth 3 -name "strategy_detail_debug.log" -exec wc -c {} +
          ls -la

      - name: Upload strategy detail diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: strategy-detail-debug-${{ github.run_id }}
          path: strategy_detail_debug.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Keep only the lean result set
        run: |
          find results -maxdepth 1 -type f \
            ! -name 'current_multicriteria.csv' \
            ! -name 'current_multicriteria_summary.txt' \
            ! -name 'scan_meta.json' \
            ! -name 'type_census.json' \
            -delete

      - name: Upload 90-day archival snapshot
        uses: actions/upload-artifact@v4
        with:
          name: binance-bots-${{ github.run_id }}
          path: results/history/
          retention-days: 90
          compression-level: 9

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          git commit -m "audit: hourly snapshot [skip ci]"

          # The scan can take several minutes while another maintenance/result
          # commit may land on main. Rebase the generated snapshot onto the
          # latest main before pushing, and retry the push if main advances.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Results pushed successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; refreshing origin/main."
            git fetch origin main
          done

          echo "Unable to push audit results after 3 attempts."
          exit 1

      - name: Compact Git history monthly
        if: ${{ github.event_name == 'schedule' && startsWith(github.event.schedule, '15 0 1 * *') }}
        run: |
          git fetch origin main
          git checkout --orphan compact-main
          git add -A
          git commit -m "maintenance: compact retained bot history [skip ci]"
          git push --force origin HEAD:main
